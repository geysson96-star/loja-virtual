<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>
.card .media img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .media img{transform:scale(1.06)}
.card .media > svg, .card .media > img{position:absolute;inset:0}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.logo-name{font-weight:700;font-size:22px;letter-spacing:-.6px;color:var(--navy)}
.co{display:none}
.co.on{display:block}
.co label{display:block;font-size:13px;font-weight:500;margin:12px 0 6px}
.co input,.co select,.co textarea{width:100%;font:inherit;font-size:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;outline:0;background:#fff}
.co input:focus,.co select:focus,.co textarea:focus{border-color:var(--navy)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:500}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.err{color:#c62828;font-size:13px;margin-top:10px;min-height:18px}
.done{text-align:center;padding:30px 4px}
.done .ok{width:72px;height:72px;border-radius:50%;background:#e7f7ee;color:#1e9e5a;display:grid;place-items:center;font-size:34px;margin:0 auto 16px}
.done h4{font-size:20px;margin-bottom:8px}
.done p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:18px}
.demo-flag{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:0;background:#111;color:#fff;font-size:12px;padding:6px 14px;border-radius:10px 10px 0 0;z-index:70;opacity:.85}
.demo-flag a{color:#ffd27a;text-decoration:underline}
/* modal do produto */
.pmodal{position:fixed;inset:0;display:grid;place-items:center;z-index:105;padding:20px;pointer-events:none}
.pmodal .box:has(.pm-media[style*=none]){grid-template-columns:1fr;max-width:620px}
.pmodal .box{background:#fff;border-radius:22px;max-width:920px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;opacity:0;transform:scale(.96);transition:.3s;pointer-events:none}
.pmodal.on .box{opacity:1;transform:none;pointer-events:auto}
.pmodal .pm-media{aspect-ratio:1;background:var(--soft)}
.pmodal .pm-info{padding:36px;display:flex;flex-direction:column;gap:10px;position:relative}
.pmodal h3{font-size:24px;line-height:1.25;letter-spacing:-.5px}
.pmodal .cat{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);font-weight:600}
.pmodal .stock{font-size:13px;color:var(--muted)}
.pmodal .desc{font-size:14.5px;color:#4a5060;line-height:1.65;margin:6px 0 10px;white-space:pre-line}
.pmodal .close{position:absolute;top:14px;right:14px}
@media (max-width:760px){.pmodal .box{grid-template-columns:1fr}.pmodal .pm-info{padding:24px}}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center;font-weight:700;color:var(--muted);z-index:1;letter-spacing:1px}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-track" id="topbar"></div></div>

<header id="header">
  <div class="wrap head-main">
    <div class="head-left">
      <button class="burger" id="openMenu" aria-label="Abrir menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h12"/></svg></button>
      <a href="#ofertas">Ofertas</a>
      <a href="#contato">Fale com a gente</a>
    </div>
    <a href="#" class="logo" id="logo"></a>
    <div class="head-right">
      <button class="icon-btn" id="openSearch" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <a class="icon-btn hide-s" href="admin.html" aria-label="Área administrativa"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
      <button class="icon-btn" id="favBtn" aria-label="Favoritos"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span class="badge-count" id="favCount">0</span></button>
      <button class="icon-btn" id="openCart" aria-label="Carrinho"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge-count" id="cartCount">0</span></button>
    </div>
  </div>
  <nav class="cats" aria-label="Categorias"><div class="wrap"><ul id="catNav"></ul></div></nav>
</header>

<section class="hero" aria-label="Destaques">
  <div class="slides" id="slides"></div>
  <button class="hero-arrow prev" id="prev" aria-label="Anterior">←</button>
  <button class="hero-arrow next" id="next" aria-label="Próximo">→</button>
  <div class="hero-dots" id="dots"></div>
</section>

<section class="block" id="principais" data-sec="main">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="kicker" id="tMainK"></div><h2 id="tMainT"></h2></div>
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="novidades" id="tTab1"></button>
        <button class="tab" data-tab="mais" id="tTab2"></button>
        <button class="tab" data-tab="ofertas" id="tTab3"></button>
      </div>
    </div>
    <div class="rail-wrap"><button class="rail-nav l" aria-label="Voltar">←</button><div class="rail" id="railMain"></div><button class="rail-nav r" aria-label="Avançar">→</button></div>
  </div>
</section>

<div id="catSections"></div>

<section class="block reveal" id="ofertas" style="padding-top:0" data-sec="banner">
  <div class="wrap">
    <div class="banner">
      <svg class="art" viewBox="0 0 1280 440" preserveAspectRatio="xMidYMid slice" id="bannerArt"></svg>
      <div class="copy">
        <div class="kicker" style="color:#fff;opacity:.8" id="tBanK"></div>
        <h2 id="tBanT"></h2>
        <p id="tBanP"></p>
        <a href="#principais" class="btn btn-light" id="tBanB"></a>
      </div>
    </div>
  </div>
</section>

<section class="block values reveal" style="padding-top:0" data-sec="values">
  <div class="wrap">
    <div class="intro"><div class="kicker" id="tValK"></div><h2 id="tValT"></h2><p id="tValP"></p></div>
    <div class="val-grid" id="values"></div>
  </div>
</section>

<section class="perks reveal" data-sec="perks">
  <div class="wrap perk-grid" id="perks"></div>
</section>

<footer id="contato">
  <div class="wrap">
    <div class="news" data-sec="news">
      <div><h3 id="tNewsT"></h3><p id="tNewsP"></p></div>
      <div><form id="newsForm"><input type="email" required placeholder="Seu melhor e-mail" aria-label="E-mail"><button class="btn btn-red" type="submit">Enviar</button></form><div class="ok" id="newsOk"></div></div>
    </div>
    <div class="foot-grid">
      <div class="foot-brand"><div class="logo-name" style="color:#fff" id="fName"></div><p id="fAddr"></p><div class="social" id="social"></div></div>
      <div><h5 id="tCatsH"></h5><div id="fCats"></div></div>
      <div><h5 id="tHelpH"></h5><div id="fHelp"></div></div>
      <div><h5 id="tContH"></h5><div id="fContact"></div></div>
    </div>
    <div class="legal"><span id="fLegal"></span><div class="pay" id="fPay"></div></div>
  </div>
</footer>

<a class="wa" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2.1 1c.3.2.5.2.6.4 0 .1 0 .7-.2 1.3Z"/></svg></a>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="cart" aria-label="Carrinho">
  <div class="drawer-head"><h4 id="cartTitle">Seu carrinho</h4><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
  <div class="drawer-body">
    <div id="stepCart">
      <div class="ship-bar" id="shipBar"></div>
      <div id="cartItems"></div>
    </div>
    <form class="co" id="stepForm" autocomplete="on">
      <label>Seu nome</label><input name="name" required maxlength="80">
      <label>WhatsApp</label><input name="phone" required inputmode="tel" placeholder="(00) 0 0000-0000" maxlength="30">
      <label>Como quer receber?</label>
      <div class="seg" id="segDel"><button type="button" class="on" data-v="Entrega">Entrega</button><button type="button" data-v="Retirada na loja">Retirar na loja</button></div>
      <div id="addrBox"><label>Endereço de entrega</label><textarea name="address" rows="2" maxlength="200"></textarea></div>
      <label>Pagamento</label>
      <select name="payment" id="paySel"></select>
      <label>Observação (opcional)</label><input name="note" maxlength="300">
      <div class="err" id="coErr"></div>
    </form>
    <div class="done" id="stepDone" style="display:none"></div>
  </div>
  <div class="drawer-foot" id="cartFoot">
    <div class="total"><span>Subtotal</span><b id="cartTotal">R$ 0,00</b></div>
    <button class="btn btn-red" id="checkout">Finalizar pedido</button>
    <small id="footNote"></small>
  </div>
</aside>

<aside class="drawer left" id="mobMenu" aria-label="Menu">
  <div class="drawer-head"><div class="logo-name" id="mName"></div><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
  <div class="drawer-body mob-nav" id="mobNav"></div>
</aside>

<div class="search-panel" id="search">
  <div class="wrap">
    <div class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="O que você procura?" autocomplete="off"><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
    <div class="search-results"><div class="chips" id="chips"></div><div class="grid" id="results"></div></div>
  </div>
</div>

<div class="pmodal" id="pmodal"><div class="box"><div class="pm-media" id="pmMedia"></div><div class="pm-info" id="pmInfo"></div></div></div>

<div class="cookie off" id="cookie"><span id="tCookie"></span><div class="row"><button class="btn btn-outline" data-ck>Rejeitar</button><button class="btn btn-navy" data-ck>Aceitar tudo</button></div></div>
<div class="toast" id="toast"><i>✓</i><span id="toastMsg"></span></div>

<script src="api.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let S, C, CATS=[], PRODS=[], SOLD={};
const inst=v=>{ const n=+C.installments||1; return n>1&&v>=(+C.installmentsMin||0)?`<div class="inst">ou ${n}x de ${brl(v/n)} sem juros</div>`:'' };
let st={cart:{},fav:[]};
try{ st=JSON.parse(localStorage.getItem('loja_cart'))||st }catch(e){}
const save=()=>{ try{localStorage.setItem('loja_cart',JSON.stringify(st))}catch(e){} };
const waLink=(msg)=>`https://wa.me/${(S.whatsapp||'').replace(/\D/g,'')}${msg?'?text='+encodeURIComponent(msg):''}`;
const byId=id=>PRODS.find(p=>p.id===String(id));

/* ---------- arte do hero (gerada com as cores da loja) ---------- */
function heroArt(kind){
  const p=S.primary, a=S.accent;
  const stars='<g opacity=".5" fill="#fff"><circle cx="120" cy="80" r="2"/><circle cx="380" cy="40" r="1.5"/><circle cx="640" cy="120" r="2"/><circle cx="900" cy="60" r="1.6"/><circle cx="1300" cy="110" r="2"/><circle cx="760" cy="560" r="2"/></g>';
  const pote=(x,y,s,c1,c2,cls)=>`<g transform="translate(${x} ${y}) scale(${s})"><g class="float ${cls||''}"><rect x="0" y="40" width="220" height="170" rx="26" fill="${c2}"/><rect x="-10" y="20" width="240" height="42" rx="16" fill="${c1}"/><rect x="60" y="8" width="100" height="18" rx="9" fill="${c1}"/></g></g>`;
  const cup=(x,y,s,c,cls)=>`<g transform="translate(${x} ${y}) scale(${s})"><g class="float ${cls||''}"><rect x="96" y="-10" width="10" height="70" rx="5" fill="#fff"/><rect x="0" y="40" width="140" height="34" rx="12" fill="${c}"/><path d="M6 74h128l-14 230c-1 10-9 16-18 16H38c-9 0-17-6-18-16Z" fill="${c}"/></g></g>`;
  if(kind==='oferta') return `<rect width="1440" height="620" fill="#111418"/><g class="float"><circle cx="1100" cy="300" r="230" fill="${a}"/></g><text x="1100" y="295" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="150" fill="#fff" letter-spacing="-6">40%</text><text x="1100" y="365" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="38" fill="#fff" letter-spacing="8">OFF</text>`;
  if(kind==='organiza') return `<rect width="1440" height="620" fill="#eef4f3"/>${pote(860,330,1,p,'#ffffff')}${pote(1120,330,1,a,'#ffffff','d2')}${pote(990,90,1,p,'#cfe3e1','d3')}`;
  return `<defs><radialGradient id="hg" cx="70%" cy="40%" r="80%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${p}"/></radialGradient></defs><rect width="1440" height="620" fill="url(#hg)"/>${stars}${cup(1040,120,1.1,'#ffffff')}${pote(820,330,.9,'#ffffff',p,'d2')}${pote(1200,380,.7,p,'#ffffff','d3')}<g class="float d2" fill="#FFD27A"><path d="M760 140l8 18 20 2-15 13 5 20-18-11-18 11 5-20-15-13 20-2Z"/></g>`;
}

/* ---------- render geral ---------- */
function theme(){
  C=contentOf(S);
  const r=document.documentElement.style;
  r.setProperty('--navy',S.primary); r.setProperty('--navy-2',S.primary); r.setProperty('--red',S.accent);
  r.setProperty('--red-soft',S.accent+'1f');
  document.title=`${S.name} — ${S.tagline||'Loja oficial'}`;
}
function card(p,i=0){
  const off=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  const tags=(p.novo?`<span class="tag new">${esc(C.newBadge)}</span>`:'')+(off?`<span class="tag off">-${off}%</span>`:'');
  const fav=st.fav.includes(p.id);
  return `<article class="card" style="animation-delay:${i*50}ms">
    <div class="media" data-open="${p.id}" style="cursor:pointer">
      <div class="tags">${tags}</div>
      ${p.stock<=0?`<div class="soldout">${esc(C.soldOut)}</div>`:''}
      <button class="fav ${fav?'on':''}" data-fav="${p.id}" aria-label="Favoritar"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>
      ${prodArt(p)}
      ${p.stock>0?`<button class="quick" data-add="${p.id}">${esc(C.addBtn)}</button>`:''}
    </div>
    <div class="info">
      ${p.colors&&p.colors.length?`<div class="swatches">${p.colors.slice(0,4).map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</div>`:''}
      <h3>${esc(p.name)}</h3>
      <div class="price"><b>${brl(p.price)}</b>${off?`<s>${brl(p.oldPrice)}</s>`:''}</div>
      ${inst(p.price)}
    </div></article>`;
}
function fill(el,list){ el.innerHTML=list.length?list.map(card).join(''):'<p style="color:var(--muted)">Nenhum produto aqui ainda.</p>'; el.scrollLeft=0; updateRails(); }
const lists={
  novidades:()=>{ const n=PRODS.filter(p=>p.novo); return (n.length?n:[...PRODS].sort((a,b)=>b.created-a.created)).slice(0,12) },
  mais:()=>[...PRODS].sort((a,b)=>(b.destaque-a.destaque)||((SOLD[b.id]||0)-(SOLD[a.id]||0))).slice(0,12),
  ofertas:()=>PRODS.filter(p=>p.oldPrice>p.price)
};

function render(){
  theme();
  const initials=S.name.split(/\s+/).filter(w=>/\w/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  $('#logo').innerHTML=C.logo?`<img src="${C.logo}" alt="${esc(S.name)}" style="height:${+C.logoHeight||40}px;width:auto;max-width:220px;object-fit:contain">`:`<span class="logo-mark">${esc(initials)}</span><span><span class="logo-name">${esc(S.name)}</span><div class="logo-sub">${esc(S.tagline||'')}</div></span>`;
  $('#mName').textContent=$('#fName').textContent=S.name;
  $('#topbar').innerHTML=(S.topbar||[]).map(t=>`<span><i class="dot"></i>${esc(t)}</span>`).join('');
  $('#catNav').innerHTML=`<li><a href="#ofertas" class="hot">Ofertas</a></li>`+CATS.map(c=>`<li><a href="#cat-${slug(c)}">${esc(c)}</a></li>`).join('');
  $('#mobNav').innerHTML=`<a href="#ofertas" data-close>Ofertas<span>›</span></a>`+CATS.map(c=>`<a href="#cat-${slug(c)}" data-close>${esc(c)}<span>›</span></a>`).join('')+`<a href="admin.html">Área administrativa<span>›</span></a>`;
  // hero
  const now=Date.now();
  const H=(S.heroes||[]).filter(h=>h.active!==false&&(!h.start||new Date(h.start+'T00:00').getTime()<=now)&&(!h.end||new Date(h.end+'T23:59').getTime()>=now));
  $('.hero').style.display=H.length?'':'none';
  $('#slides').innerHTML=H.map(h=>{
    const img=!!h.image, light=img?h.textColor==='dark':(h.art==='organiza'||h.textColor==='dark');
    const hide=img&&h.textColor==='none';
    const bg=img?`<picture class="art">${h.imageMobile?`<source media="(max-width:760px)" srcset="${h.imageMobile}">`:''}<img src="${h.image}" alt="${esc(h.title+' '+h.highlight)}" style="width:100%;height:100%;object-fit:cover"></picture>${hide?'':`<div class="art" style="background:linear-gradient(90deg,${light?'rgba(255,255,255,.75)':'rgba(0,0,0,.45)'},transparent 65%)"></div>`}`
      :`<svg class="art" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid slice">${heroArt(h.art)}</svg>`;
    const link=h.link||(h.art==='oferta'?'#ofertas':'#principais');
    return `<div class="slide">${bg}
    ${hide?`<a href="${esc(link)}" class="art" aria-label="${esc(h.title||'Ver campanha')}" style="z-index:2"></a>`:`<div class="copy" ${light?'style="color:var(--navy)"':''}>
      ${h.eyebrow?`<span class="eyebrow" ${light?'style="background:rgba(0,0,0,.06)"':''}>✦ ${esc(h.eyebrow)}</span>`:''}
      <h1>${esc(h.title)} <em ${light?'style="color:var(--red)"':''}>${esc(h.highlight)}</em></h1>
      ${h.text?`<p ${light?'style="color:#3a4a4a"':''}>${esc(h.text)}</p>`:''}
      <a href="${esc(link)}" class="btn ${light?'btn-navy':h.art==='oferta'&&!img?'btn-red':'btn-light'}">${esc(h.btn||'Ver mais')} →</a>
    </div>`}</div>`}).join('');
  setupHero();
  // vitrines
  fill($('#railMain'), lists.novidades());
  $('#catSections').innerHTML=!C.catSectionsShow?'':CATS.map(c=>{const l=PRODS.filter(p=>p.category===c); if(!l.length) return ''; return `
    <section class="block reveal" id="cat-${slug(c)}" style="padding-top:0"><div class="wrap">
      <div class="sec-head"><div><div class="kicker">${esc(c)}</div><h2>${esc(c)}</h2></div></div>
      <div class="rail-wrap"><button class="rail-nav l" aria-label="Voltar">←</button><div class="rail">${l.map(card).join('')}</div><button class="rail-nav r" aria-label="Avançar">→</button></div>
    </div></section>`}).join('');
  $('#bannerArt').innerHTML=`<rect width="1280" height="440" fill="${S.primary}"/><circle cx="1050" cy="120" r="260" fill="#ffffff" opacity=".06"/>${heroArt('organiza').replace(/<rect width="1440" height="620" fill="[^"]+"\/>/,'').replace(/translate\((\d+) (\d+)\)/g,(m,x,y)=>`translate(${x-150} ${y-80})`)}`;
  $('#values').innerHTML=(S.values||[]).map((v,i)=>`<div class="val"><div class="ic"><svg viewBox="0 0 24 24">${['<path d="m12 3 2.6 5.4 5.9.9-4.3 4.1 1 5.9L12 16.5 6.8 19.3l1-5.9L3.5 9.3l5.9-.9Z"/>','<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>','<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>'][i%3]}</svg></div><h3>${esc(v.t)}</h3><p>${esc(v.d)}</p></div>`).join('');

  const T=(id,v)=>{ const e=$(id); if(e) e.textContent=v||'' };
  const show=(k,on)=>$$(`[data-sec="${k}"]`).forEach(e=>e.style.display=on?'':'none');
  show('main',C.mainShow); show('banner',C.bannerShow); show('values',C.valuesShow); show('perks',C.perksShow); show('news',C.newsShow);
  T('#tMainK',C.mainKicker); T('#tMainT',C.mainTitle); T('#tTab1',C.tabNovidades); T('#tTab2',C.tabMais); T('#tTab3',C.tabOfertas);
  T('#tBanK',C.bannerKicker); T('#tBanT',C.bannerTitle); T('#tBanP',C.bannerText); T('#tBanB',(C.bannerBtn||'Ver mais')+' →'); $('#tBanB').href=C.bannerLink||'#principais';
  if(C.bannerImage) $('#bannerArt').outerHTML=`<img class="art" id="bannerArt" src="${C.bannerImage}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  T('#tValK',C.valuesKicker); T('#tValT',C.valuesTitle); T('#tValP',C.valuesText);
  T('#tNewsT',C.newsTitle); T('#tNewsP',C.newsText); T('#tCatsH',C.catsTitle); T('#tHelpH',C.helpTitle); T('#tContH',C.contactTitle);
  T('#tCookie',C.cookieText); if(step==='cart') $('#footNote').textContent=C.checkoutNote; let ck=null; try{ck=localStorage.getItem('loja_ck')}catch(e){} $('#cookie').classList.toggle('off',!C.cookieShow||!!ck);
  const PI=['<path d="M3 7h12v10H3zM15 10h4l2 3v4h-6"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>','<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/>','<path d="M20 12 12 20 4 12V4h8Z"/><circle cx="8" cy="8" r="1.5"/>','<path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12Z"/>'];
  $('#perks').innerHTML=(C.perks||[]).map((p,i)=>`<div class="perk"><div class="ic"><svg viewBox="0 0 24 24">${PI[i%4]}</svg></div><div><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div></div>`).join('');
  $('#fHelp').innerHTML=(C.pages||[]).map((p,i)=>`<a href="#" data-page="${i}">${esc(p.t)}</a>`).join('');
  $('#fPay').innerHTML=String(C.payments||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x.toUpperCase())}</span>`).join('');
  $('#paySel').innerHTML=String(C.paymentOptions||'PIX').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<option>${esc(x)}</option>`).join('');
  $('#segDel').querySelector('[data-v="Entrega"]').style.display=C.deliveryShow?'':'none';
  $('#segDel').querySelector('[data-v="Retirada na loja"]').style.display=C.pickupShow?'':'none';
  if(!C.deliveryShow&&C.pickupShow){ $('#segDel').querySelector('[data-v="Retirada na loja"]').click() }
  if(C.favicon){ let l=document.querySelector('link[rel=icon]'); if(!l){ l=document.createElement('link'); l.rel='icon'; document.head.appendChild(l) } l.href=C.favicon }
  // rodapé
  $('#fAddr').innerHTML=`${esc(S.address)}<br>${esc(S.hours)}`;
  $('#fCats').innerHTML=CATS.map(c=>`<a href="#cat-${slug(c)}">${esc(c)}</a>`).join('');
  const wa=(S.whatsapp||'').replace(/\D/g,'');
  $('#fContact').innerHTML=(wa?`<a href="${waLink()}" target="_blank" rel="noopener">WhatsApp ${fmtPhone(wa)}</a>`:'')+(S.instagram?`<a href="https://instagram.com/${esc(S.instagram.replace('@',''))}" target="_blank" rel="noopener">@${esc(S.instagram.replace('@',''))}</a>`:'');
  $('#social').innerHTML=(S.instagram?`<a href="https://instagram.com/${esc(S.instagram.replace('@',''))}" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></a>`:'')+(wa?`<a href="${waLink()}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12Z"/></svg></a>`:'');
  $('#fLegal').textContent=C.legal||`© ${new Date().getFullYear()} ${S.name}. Preços e condições sujeitos a alteração sem aviso prévio. Imagens meramente ilustrativas.`;
  $('#waFloat').href=waLink('Olá! Vim pelo site.');
  bindRails(); observe(); renderCart();
}
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
const fmtPhone=n=>n.length>=12?`(${n.slice(2,4)}) ${n.slice(4,n.length-4)}-${n.slice(-4)}`:n;

/* ---------- hero ---------- */
let cur=0,timer;
function setupHero(){
  const N=$('#slides').children.length;
  $('#dots').innerHTML=Array.from({length:N},(_,i)=>`<button aria-label="Slide ${i+1}"><i></i></button>`).join('');
  const go=i=>{ cur=(i+N)%N; $('#slides').style.transform=`translateX(-${cur*100}%)`;
    $$('#dots button').forEach((d,k)=>{d.classList.remove('on'); void d.offsetWidth; if(k===cur)d.classList.add('on')});
    clearTimeout(timer); timer=setTimeout(()=>go(cur+1),6000) };
  $$('#dots button').forEach((d,i)=>d.onclick=()=>go(i));
  $('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1);
  let sx=0; $('#slides').ontouchstart=e=>sx=e.touches[0].clientX;
  $('#slides').ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(cur+(dx<0?1:-1))};
  if(N) go(0);
}

/* ---------- carrosséis ---------- */
function updateRails(){ $$('.rail-wrap').forEach(w=>{ const r=w.querySelector('.rail'); w.querySelector('.rail-nav.l').disabled=r.scrollLeft<5; w.querySelector('.rail-nav.r').disabled=r.scrollLeft+r.clientWidth>=r.scrollWidth-5 }) }
function bindRails(){ $$('.rail-wrap').forEach(w=>{ const r=w.querySelector('.rail');
  w.querySelector('.rail-nav.l').onclick=()=>r.scrollBy({left:-r.clientWidth,behavior:'smooth'});
  w.querySelector('.rail-nav.r').onclick=()=>r.scrollBy({left:r.clientWidth,behavior:'smooth'});
  r.onscroll=updateRails }); updateRails() }
addEventListener('resize',updateRails);
$$('#tabs .tab').forEach(t=>t.onclick=()=>{ $$('#tabs .tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); fill($('#railMain'),lists[t.dataset.tab]()) });

/* ---------- topbar / header ---------- */
let tb=0; setInterval(()=>{ const n=(S&&S.topbar||[]).length||1; tb=(tb+1)%n; $('#topbar').style.transform=`translateY(-${tb*36}px)` },3500);
addEventListener('scroll',()=>$('#header').classList.toggle('scrolled',scrollY>10),{passive:true});

/* ---------- carrinho ---------- */
let step='cart', delivery='Entrega';
function cartLines(){ return Object.keys(st.cart).map(k=>({p:byId(k),q:st.cart[k]})).filter(x=>x.p&&x.q>0) }
function renderCart(){
  Object.keys(st.cart).forEach(k=>{ if(!byId(k)) delete st.cart[k] });
  const L=cartLines(), count=L.reduce((s,x)=>s+x.q,0), total=L.reduce((s,x)=>s+x.q*x.p.price,0);
  const cc=$('#cartCount'); cc.textContent=count; cc.classList.toggle('on',count>0);
  $('#cartTotal').textContent=brl(total);
  const F=+S.freeShip||0;
  $('#shipBar').style.display=F?'':'none';
  if(F) $('#shipBar').innerHTML=(total>=F?'🎉 Você ganhou <b>entrega grátis</b>!':`Faltam <b>${brl(F-total)}</b> para entrega grátis`)+`<div class="bar"><i style="width:${Math.min(100,total/F*100)}%"></i></div>`;
  $('#cartItems').innerHTML=L.length?L.map(({p,q})=>`<div class="line-item"><div class="th">${prodArt(p)}</div>
    <div><h6>${esc(p.name)}</h6><div class="qty"><button data-q="${p.id}" data-d="-1">−</button><span>${q}</span><button data-q="${p.id}" data-d="1">+</button></div></div>
    <div><div class="p">${brl(p.price*q)}</div><button class="rm" data-q="${p.id}" data-d="-999">Remover</button></div></div>`).join('')
    :`<div class="empty"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Seu carrinho está vazio</div>`;
  $('#checkout').disabled=!L.length; $('#checkout').style.opacity=L.length?1:.5;
  const fc=$('#favCount'); fc.textContent=st.fav.length; fc.classList.toggle('on',st.fav.length>0);
  save();
}
function setStep(s){
  step=s; $('#stepCart').style.display=s==='cart'?'':'none';
  $('#stepForm').classList.toggle('on',s==='form'); $('#stepDone').style.display=s==='done'?'':'none';
  $('#cartFoot').style.display=s==='done'?'none':'';
  $('#cartTitle').textContent={cart:'Seu carrinho',form:'Seus dados',done:'Pedido enviado'}[s];
  $('#checkout').textContent=s==='cart'?'Finalizar pedido':'Enviar pedido';
  $('#footNote').innerHTML=s==='form'?'<a href="#" id="backCart" style="text-decoration:underline">← Voltar ao carrinho</a>':esc(C.checkoutNote);
  const b=$('#backCart'); if(b) b.onclick=e=>{e.preventDefault(); setStep('cart')};
}
$$('#segDel button').forEach(b=>b.onclick=()=>{ $$('#segDel button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); delivery=b.dataset.v; $('#addrBox').style.display=delivery==='Entrega'?'':'none' });
$('#checkout').onclick=async()=>{
  if(step==='cart'){ if(cartLines().length) setStep('form'); return }
  const f=$('#stepForm'); if(!f.reportValidity()) return;
  const fd=Object.fromEntries(new FormData(f));
  if(delivery==='Entrega'&&!fd.address.trim()){ $('#coErr').textContent='Informe o endereço de entrega.'; return }
  $('#coErr').textContent=''; const btn=$('#checkout'); btn.disabled=true; btn.textContent='Enviando...';
  try{
    const o=await API.order({items:cartLines().map(x=>({id:x.p.id,qty:x.q})),customer:{name:fd.name,phone:fd.phone,delivery,address:fd.address},payment:fd.payment,note:fd.note});
    const msg=`Olá! Fiz o pedido nº ${o.id} pelo site:\n`+o.items.map(i=>`• ${i.qty}x ${i.name} — ${brl(i.price*i.qty)}`).join('\n')+`\nTotal: ${brl(o.total)}\nPagamento: ${o.payment}\n${o.customer.delivery}${o.customer.address?': '+o.customer.address:''}\nNome: ${o.customer.name}`;
    st.cart={}; renderCart(); f.reset();
    $('#stepDone').innerHTML=`<div class="ok">✓</div><h4>Pedido nº ${esc(o.id)} recebido!</h4><p>Total de <b>${brl(o.total)}</b>. ${esc(C.orderDoneText)}</p>
      <a class="btn btn-red" style="width:100%;justify-content:center" href="${waLink(msg)}" target="_blank" rel="noopener">Confirmar no WhatsApp</a>`;
    setStep('done'); refresh();
  }catch(e){ $('#coErr').textContent=e.message }
  finally{ btn.disabled=false; if(step==='form') btn.textContent='Enviar pedido' }
};
function addToCart(id){ const p=byId(id); if(!p) return; const q=(st.cart[id]||0)+1; if(q>p.stock){ toast(`Só temos ${p.stock} em estoque`); return }
  st.cart[id]=q; renderCart(); bump($('#cartCount')); toast('Adicionado ao carrinho') }
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump') }
function toast(m){ $('#toastMsg').textContent=m; const t=$('#toast'); t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200) }

/* ---------- produto (modal) ---------- */
function openProduct(id){
  const p=byId(id); if(!p) return; closeAll(); $('#pmMedia').style.display='';
  const off=p.oldPrice>p.price;
  $('#pmMedia').innerHTML=prodArt(p);
  $('#pmInfo').innerHTML=`<button class="icon-btn close" data-close aria-label="Fechar">✕</button>
    <div class="cat">${esc(p.category)}</div><h3>${esc(p.name)}</h3>
    <div class="price"><b style="font-size:26px">${brl(p.price)}</b>${off?`<s>${brl(p.oldPrice)}</s>`:''}</div>
    ${inst(p.price)}
    ${p.description?`<div class="desc">${esc(p.description)}</div>`:''}
    <div class="stock">${p.stock>0?(p.stock<=5?`Últimas ${p.stock} unidades!`:'Em estoque'):'Esgotado'}</div>
    ${p.stock>0?`<button class="btn btn-navy" data-add="${p.id}" style="justify-content:center;margin-top:8px">Adicionar ao carrinho</button>`:''}
    <a class="btn btn-outline" style="justify-content:center" target="_blank" rel="noopener" href="${waLink('Olá! Tenho interesse no produto: '+p.name)}">Perguntar no WhatsApp</a>`;
  $('#pmodal').classList.add('on'); $('#overlay').classList.add('on'); document.body.style.overflow='hidden';
}

/* ---------- cliques ---------- */
document.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]'); if(add){ e.stopPropagation(); addToCart(add.dataset.add); return }
  const fav=e.target.closest('[data-fav]'); if(fav){ const id=fav.dataset.fav,i=st.fav.indexOf(id);
    if(i>-1) st.fav.splice(i,1); else st.fav.push(id);
    $$(`[data-fav="${id}"]`).forEach(b=>b.classList.toggle('on',i===-1)); renderCart(); bump($('#favCount')); toast(i>-1?'Removido dos favoritos':'Salvo nos favoritos'); return }
  const q=e.target.closest('[data-q]'); if(q){ const k=q.dataset.q, p=byId(k); let n=Math.max(0,(st.cart[k]||0)+ +q.dataset.d); if(p&&n>p.stock){ n=p.stock; toast(`Só temos ${p.stock} em estoque`) } st.cart[k]=n; renderCart(); return }
  const op=e.target.closest('[data-open]'); if(op){ openProduct(op.dataset.open); return }
  if(e.target.closest('[data-close]')||e.target.id==='overlay'||e.target.id==='pmodal') closeAll();
  if(e.target.closest('[data-ck]')){ $('#cookie').classList.add('off'); try{localStorage.setItem('loja_ck','1')}catch(x){} }
  const pg=e.target.closest('[data-page]'); if(pg){ e.preventDefault(); const P=(C.pages||[])[+pg.dataset.page]; if(!P) return; closeAll();
    $('#pmMedia').style.display='none'; $('#pmInfo').innerHTML=`<button class="icon-btn close" data-close aria-label="Fechar">✕</button><h3>${esc(P.t)}</h3><div class="desc">${esc(P.b)}</div>`;
    $('#pmodal').classList.add('on'); $('#overlay').classList.add('on'); document.body.style.overflow='hidden' }
});
function open(id){ closeAll(); $(id).classList.add('on'); $('#overlay').classList.add('on'); document.body.style.overflow='hidden' }
function closeAll(){ $$('.drawer,.search-panel,.overlay,.pmodal').forEach(x=>x.classList.remove('on')); document.body.style.overflow=''; if(step==='done') setStep('cart') }
$('#openCart').onclick=()=>{ setStep(step==='form'?'form':'cart'); open('#cart') };
$('#openMenu').onclick=()=>open('#mobMenu');
$('#openSearch').onclick=()=>{ open('#search'); setTimeout(()=>$('#q').focus(),350); search('') };
$('#favBtn').onclick=()=>{ open('#search'); $('#q').value=''; showList(PRODS.filter(p=>st.fav.includes(p.id)),'Você ainda não favoritou nada.') };
addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll() });

/* ---------- busca ---------- */
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function showList(l,msg){ $('#results').innerHTML=l.length?l.map(card).join(''):`<p style="color:var(--muted);grid-column:1/-1">${msg||'Nenhum produto encontrado.'}</p>` }
function search(v){ const q=norm(v.trim()); showList(q?PRODS.filter(p=>norm(p.name+' '+p.category).includes(q)):PRODS.slice(0,5)) }
$('#q').oninput=e=>search(e.target.value);

$('#newsForm').onsubmit=e=>{ e.preventDefault(); $('#newsOk').textContent='✓ '+C.newsOk; e.target.reset() };

let io; function observe(){ io&&io.disconnect(); io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){en.target.classList.add('in'); io.unobserve(en.target)} }),{threshold:.1}); $$('.reveal:not(.in)').forEach(el=>io.observe(el)) }

/* ---------- carregar ---------- */
async function refresh(){ const d=await API.store(); S=d.settings; CATS=d.categories; PRODS=d.products; SOLD=d.sold||{}; return d }
(async()=>{
  try{ await refresh(); render() }catch(e){ document.body.insertAdjacentHTML('afterbegin',`<p style="padding:20px;color:#c62828">Não foi possível carregar a loja: ${esc(e.message)}</p>`) }
  if(await API.mode()==='demo') document.body.insertAdjacentHTML('beforeend','<div class="demo-flag">Modo demonstração — dados salvos só neste navegador · <a href="admin.html">abrir painel</a></div>');
})();
</script>
</body>
</html>
